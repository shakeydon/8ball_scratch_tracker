<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>8-Ball Scratch Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#07100d;--panel:#0d1d17;--panel2:#10271e;--green:#21c77a;--green2:#129a59;--text:#f5fff9;--muted:#a8c5b6;--danger:#ff6262;--gold:#ffd166;--line:#234638}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#174a35 0,#0a1b14 32%,var(--bg) 68%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}.app{max-width:980px;margin:auto}.top{text-align:center;padding:18px 4px 10px}.ball{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#050505;border:4px solid #242424;box-shadow:0 10px 24px #0008}.ball span{display:grid;place-items:center;background:white;color:#111;width:31px;height:31px;border-radius:50%;font-size:19px;font-weight:900}h1{font-size:clamp(26px,7vw,40px);margin:9px 0 2px}.sub{color:var(--muted);font-weight:650}.card{background:linear-gradient(180deg,#10241b,#0b1813);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 30px #0004;margin:12px 0}label{display:block;color:var(--muted);font-weight:750;margin:8px 0 5px}.names{display:grid;grid-template-columns:1fr;gap:9px}input{width:100%;font-size:18px;padding:15px;border-radius:13px;border:1px solid #315b49;background:#07130e;color:white}button{border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:850;cursor:pointer;min-height:52px}.primary{background:linear-gradient(#2bd989,#16aa63);color:#03120b}.secondary{background:#183529;color:#eafff3;border:1px solid #315b49}.danger{background:#35191b;color:#ffb6b6;border:1px solid #693235}.wide{width:100%;margin-top:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .wide{grid-column:1/-1;margin:0}.statsbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.metric{background:#0b1c15;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.metric b{display:block;font-size:24px;color:var(--gold)}.metric span{font-size:12px;color:var(--muted);font-weight:750}.players{display:grid;grid-template-columns:1fr;gap:12px}.player{background:linear-gradient(145deg,#123323,#0b1b14);border:1px solid #2c5a45;border-radius:20px;padding:15px;text-align:center}.player h2{margin:0;font-size:22px}.count{font-size:68px;line-height:1;font-weight:950;margin:12px 0}.scratch{width:100%;font-size:21px;min-height:66px;background:linear-gradient(#2ee08f,#17ae66);color:#03140c}.undo{width:100%;margin-top:9px;background:#182720;color:#d5e9de;border:1px solid #334c40}.view{display:none}.view.active{display:block}.historyItem{border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0;background:#0b1b14}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:13px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:24px 5px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#eafff3;color:#082016;padding:11px 16px;border-radius:999px;font-weight:800;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}.installNote{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}@media(min-width:620px){.names,.players{grid-template-columns:1fr 1fr}.statsbar{grid-template-columns:repeat(4,1fr)}}@media(min-width:900px){.players{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header class="top"><div class="ball"><span>8</span></div><h1>8-Ball Scratch Tracker</h1><div class="sub" id="dateText"></div></header>
<section id="setupView" class="view active"><div class="card"><h2>Tonight's Players</h2><div class="small">Enter 1–8 names. Blank spots are ignored.</div><div class="names" id="nameInputs"></div><button class="primary wide" id="startBtn">START 8-BALL NIGHT</button></div><div class="actions"><button class="secondary" id="historyBtn">HISTORY & STATS</button><button class="secondary" id="installBtn">INSTALL APP</button></div><div class="installNote" id="installNote">Tap Install App to add this tracker to your phone or tablet.</div></section>
<section id="gameView" class="view"><div class="statsbar"><div class="metric"><b id="playerCount">0</b><span>PLAYERS</span></div><div class="metric"><b id="totalCount">0</b><span>SCRATCHES</span></div><div class="metric"><b id="leaderCount">0</b><span>HIGH COUNT</span></div><div class="metric"><b>8</b><span>BALL</span></div></div><div class="players" id="playersGrid"></div><div class="card"><div class="actions"><button class="primary" id="finishBtn">FINISH NIGHT</button><button class="secondary" id="gameHistoryBtn">HISTORY</button><button class="danger wide" id="newBtn">NEW NIGHT</button></div></div></section>
<section id="historyView" class="view"><div class="card"><div class="row"><h2>Night History</h2><button class="secondary" id="backBtn">BACK</button></div><div id="historyList"></div></div><div class="card"><h2>Player Statistics</h2><div id="statsList"></div></div><button class="danger wide" id="clearHistoryBtn">CLEAR ALL HISTORY</button></section></div><div class="toast" id="toast"></div>
<script>
const ACTIVE='eightBallScratchActiveV1',HISTORY='eightBallScratchHistoryV1';let deferredPrompt=null,previousView='setupView';const $=id=>document.getElementById(id);$('dateText').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});for(let i=1;i<=8;i++){let d=document.createElement('div');d.innerHTML=`<label>Player ${i}</label><input id="p${i}" maxlength="28" placeholder="Enter name">`;$('nameInputs').appendChild(d)}function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}function active(){return load(ACTIVE,null)}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){const names=[...Array(8)].map((_,i)=>$('p'+(i+1)).value.trim()).filter(Boolean);if(!names.length)return toast('Enter at least one player');const seen=new Set();for(const n of names){let k=n.toLowerCase();if(seen.has(k))return toast('Player names must be different');seen.add(k)}save(ACTIVE,{date:new Date().toISOString(),players:names.map(name=>({name,count:0}))});renderGame();show('gameView')}
function renderGame(){const g=active();if(!g)return;$('playersGrid').innerHTML='';g.players.forEach((p,i)=>{let c=document.createElement('article');c.className='player';c.innerHTML=`<h2>${esc(p.name)}</h2><div class="count">${p.count}</div><button class="scratch">+1 SCRATCH</button><button class="undo">UNDO</button>`;c.querySelector('.scratch').onclick=()=>change(i,1);c.querySelector('.undo').onclick=()=>change(i,-1);$('playersGrid').appendChild(c)});$('playerCount').textContent=g.players.length;$('totalCount').textContent=g.players.reduce((a,p)=>a+p.count,0);$('leaderCount').textContent=Math.max(0,...g.players.map(p=>p.count))}
function change(i,d){let g=active();g.players[i].count=Math.max(0,g.players[i].count+d);save(ACTIVE,g);renderGame()}function finish(){let g=active();if(!g||!confirm('Finish tonight and save these results to history?'))return;g.finished=new Date().toISOString();let h=load(HISTORY,[]);h.unshift(g);save(HISTORY,h);localStorage.removeItem(ACTIVE);renderHistory();previousView='setupView';show('historyView')}function newNight(){if(active()&&!confirm('Start a new night? The unfinished current night will be cleared.'))return;localStorage.removeItem(ACTIVE);show('setupView')}
function renderHistory(){const h=load(HISTORY,[]),hl=$('historyList'),sl=$('statsList');hl.innerHTML=h.length?'':'<div class="empty">No completed nights yet.</div>';sl.innerHTML='';h.forEach(n=>{let d=document.createElement('div');d.className='historyItem';d.innerHTML=`<div class="row"><b>${new Date(n.date).toLocaleDateString()}</b><b>${n.players.reduce((a,p)=>a+p.count,0)} scratches</b></div><div class="small">${n.players.map(p=>esc(p.name)+': '+p.count).join(' • ')}</div>`;hl.appendChild(d)});let map={};h.forEach(n=>n.players.forEach(p=>{let k=p.name.toLowerCase();if(!map[k])map[k]={name:p.name,nights:0,total:0,high:0,last:n.date};let s=map[k];s.nights++;s.total+=p.count;s.high=Math.max(s.high,p.count);if(new Date(n.date)>new Date(s.last))s.last=n.date}));Object.values(map).sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{let d=document.createElement('div');d.className='historyItem';d.innerHTML=`<div class="row"><b>${esc(s.name)}</b><b>${s.total} total</b></div><div class="small">${s.nights} nights • ${(s.total/s.nights).toFixed(1)} avg/night • High: ${s.high}</div>`;sl.appendChild(d)});if(!Object.keys(map).length)sl.innerHTML='<div class="empty">Stats appear after your first completed night.</div>'}
$('startBtn').onclick=start;$('finishBtn').onclick=finish;$('newBtn').onclick=newNight;$('historyBtn').onclick=()=>{previousView='setupView';renderHistory();show('historyView')};$('gameHistoryBtn').onclick=()=>{previousView='gameView';renderHistory();show('historyView')};$('backBtn').onclick=()=>{if(previousView==='gameView'&&active()){renderGame();show('gameView')}else show('setupView')};$('clearHistoryBtn').onclick=()=>{if(confirm('Permanently delete all history?')){localStorage.removeItem(HISTORY);renderHistory()}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installNote').textContent='Ready to install on this device.'});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else alert('Open your browser menu and choose “Install app” or “Add to Home screen.”')};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));if(active()){renderGame();show('gameView')}
</script></body></html>
